# Omarchy Transcribe - Hyprland Configuration
# Add these lines to your ~/.config/hypr/hyprland.conf

# Transcription hotkey - Press SUPER+D to start transcribing
unbindd = SUPER, D
bindd = SUPER, D, Transcribe, exec, $terminal --class floating_whisper -e ~/.local/bin/omarchy-transcribe

# Window rules for the transcription window
windowrulev2 = float, class:^(floating_whisper)$
windowrulev2 = size 800 400, class:^(floating_whisper)$
windowrulev2 = center, class:^(floating_whisper)$
